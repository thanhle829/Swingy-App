name: datastorm_flutter
description: Flutter migration of Posture Analyzer (Android-first)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  go_router: ^7.0.0
  flutter_riverpod: ^2.3.6
  google_fonts: ^5.0.0
  video_player: ^2.10.1
  camera: ^0.11.3
  permission_handler: 12.0.1
